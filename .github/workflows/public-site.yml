name: Public site checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install locked build and browser dependencies
        run: npm ci --ignore-scripts

      - name: Run read-only public-site gates
        run: python3 tools/check_all.py

      - name: Install Chromium for UI regressions
        run: npx playwright install --with-deps chromium

      - name: Run offline desktop and touch browser regressions
        run: npm run test:browser

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failures
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Prove checks left the checkout clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
