<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Makoauto — Lookbook</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Curated Makoauto sets — frames pre-loaded with themed pins. Buy as a set or remix any look in the designer.">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#F5F0E3">
<meta property="og:site_name" content="Makoauto">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Makoauto — Lookbook">
<meta property="og:description" content="Curated Makoauto sets — frames pre-loaded with themed pins.">
<meta property="og:image" content="favicon.svg">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="shared/styles.css">
<style>
  .wrap { max-width: 1280px; margin: 0 auto; padding: 32px 24px 80px; }
  .head { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: end; margin-bottom: 24px; }
  .head h1 { font-size: clamp(40px,6vw,80px); line-height: .95; }
  .head p { color: var(--muted); margin-top: 8px; max-width: 560px; }

  /* Theme filter row */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; padding: 14px; background: var(--paper); border: var(--border-thick); border-radius: 999px; margin-bottom: 24px; }
  .filters .filter-btn { padding: 8px 16px; border: 1.5px solid var(--ink); border-radius: 999px; background: transparent; font-family: 'JetBrains Mono',monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
  .filters .filter-btn.active { background: var(--ink); color: var(--bg); }
  .filters .filter-btn .count { opacity: .55; margin-left: 6px; font-weight: 400; }

  /* Lookbook grid */
  .lookbook { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
  .set-card { position: relative; background: var(--paper); border: var(--border-thick); border-radius: var(--radius-lg); overflow: hidden; box-shadow: var(--shadow-hard); transition: transform .14s, box-shadow .14s; display: flex; flex-direction: column; }
  .set-card:hover { transform: translate(-3px, -3px); box-shadow: 7px 7px 0 0 var(--ink); }
  .set-card .img-wrap { aspect-ratio: 1/1; overflow: hidden; background: var(--bg-2); position: relative; }
  .set-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .set-card .price-tag { position: absolute; top: 12px; right: 12px; background: var(--lime); border: var(--border-thick); border-radius: 999px; padding: 6px 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px; box-shadow: var(--shadow-hard); display: var(--show-price, flex); }
  .set-card .ctas a.ghost { display: var(--show-remix, flex); align-items: center; justify-content: center; }
  .set-card .ctas:has(a.ghost[style*="display: none"]) { grid-template-columns: 1fr; }
  .set-card .theme-tag { position: absolute; top: 12px; left: 12px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 999px; padding: 4px 10px; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; letter-spacing: .06em; }
  .set-card .body { padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .set-card h3 { font-size: 18px; line-height: 1.2; }
  .set-card .blurb { font-size: 13px; color: var(--muted); line-height: 1.5; flex: 1; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .set-card .ctas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .set-card .ctas a { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 13px; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 999px; text-align: center; text-decoration: none; color: var(--ink); transition: transform .12s, background .12s; min-height: 44px; display: flex; align-items: center; justify-content: center; }
  .set-card .ctas a.primary { background: var(--ink); color: var(--bg); }
  .set-card .ctas a.primary:hover { background: var(--lime); color: var(--ink); }
  .set-card .ctas a.ghost:hover { background: var(--ink); color: var(--bg); }
  .set-card .oos { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); border: var(--border-thick); border-radius: 999px; padding: 4px 12px; font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; }

  /* Bottom CTA strip */
  .bottom-cta { margin-top: 60px; padding: 32px; background: var(--ink); color: var(--paper); border-radius: var(--radius-lg); display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
  .bottom-cta h2 { font-size: clamp(24px,3.5vw,40px); color: var(--paper); }
  .bottom-cta p { color: rgba(255,251,240,0.7); font-size: 15px; margin-top: 6px; }

  @media (max-width: 720px) {
    .wrap { padding-left: max(20px, env(safe-area-inset-left, 0)); padding-right: max(20px, env(safe-area-inset-right, 0)); padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
    .head { grid-template-columns: 1fr; gap: 16px; }
    .head .btn { width: 100%; justify-content: center; }
    .filters { border-radius: 18px; }
    .lookbook { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
    .bottom-cta { grid-template-columns: 1fr; text-align: center; padding: 24px; }
    .bottom-cta .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div data-topbar class="topbar"></div>
<div class="wrap">
  <div class="head">
    <div>
      <span class="chip" data-i18n="lookbook_chip">LOOKBOOK · 19 CURATED SETS</span>
      <h1 data-i18n="lookbook_title">Lookbook</h1>
      <p data-i18n="lookbook_sub">Pre-loaded combinations of frame and pins. Buy a set as-is, or open it in the designer and remix it into your own.</p>
    </div>
    <a class="btn primary" href="designer.html" data-i18n="open_designer">Open designer →</a>
  </div>

  <div class="filters" id="filters"></div>

  <div class="lookbook" id="lookbook">
    <!-- cards rendered by JS -->
  </div>

  <div class="bottom-cta">
    <div>
      <h2 data-i18n="lookbook_cta_h">None of these speak to you?</h2>
      <p data-i18n="lookbook_cta_p">Open the designer and pick from 100+ pins — letters, numbers, emoji, flags, more.</p>
    </div>
    <a class="btn primary" href="designer.html" data-i18n="cta_start">Start designing</a>
  </div>
</div>

<script src="shared/i18n.js?v=10"></script>
<script src="shared/i18n-extended.js?v=1"></script>
<script src="shared/localize-product.js?v=1"></script>
<script src="shared/placeholders.js?v=9"></script>
<script>
  // ---- Tweaks defaults (read by EDITMODE host; mirrored at runtime) ----
  const TWEAKS = /*EDITMODE-BEGIN*/{
    "brand_name": "Makoauto",
    "lookbook_kicker": "",
    "lookbook_h1": "",
    "card_min_width": 280,
    "show_price_tag": true,
    "show_remix_btn": true,
    "show_filters": true,
    "accent_color": "#D8FF6B"
  }/*EDITMODE-END*/;
  window.__catalogTweaks = TWEAKS;

  // Hook window.t so brand-name swap propagates to every i18n string.
  const _t = window.t;
  window.t = (key) => {
    let s = _t(key);
    const b = window.__catalogTweaks.brand_name || 'Makoauto';
    if (b !== 'Makoauto') s = s.replace(/Makoauto/g, b);
    return s;
  };

  // Patch renderTopbar so the wordmark uses the current brand.
  const _renderTopbar = window.renderTopbar;
  window.renderTopbar = (active) => {
    _renderTopbar(active);
    const logo = document.querySelector('.topbar .logo');
    if (logo) logo.textContent = window.__catalogTweaks.brand_name || 'Makoauto';
  };

  function applyTweaks() {
    const t = window.__catalogTweaks;
    // 1. Topbar wordmark
    const logo = document.querySelector('.topbar .logo');
    if (logo) logo.textContent = t.brand_name || 'Makoauto';
    // 2. Document title
    document.title = `${t.brand_name || 'Makoauto'} \u2014 Lookbook`;
    // 3. Re-apply i18n strings (which now flow through the patched t())
    window.applyI18N && window.applyI18N();
    // 4. Override H1 / kicker if user set custom strings
    const chip = document.querySelector('[data-i18n="lookbook_chip"]');
    if (chip && t.lookbook_kicker) chip.textContent = t.lookbook_kicker;
    const h1 = document.querySelector('[data-i18n="lookbook_title"]');
    if (h1 && t.lookbook_h1) h1.textContent = t.lookbook_h1;
    // 5. Grid density
    document.querySelectorAll('.lookbook').forEach(el => {
      el.style.gridTemplateColumns = `repeat(auto-fill, minmax(${t.card_min_width}px, 1fr))`;
    });
    // 6. Visibility toggles
    document.documentElement.style.setProperty('--show-price', t.show_price_tag ? 'flex' : 'none');
    document.documentElement.style.setProperty('--show-remix', t.show_remix_btn ? 'flex' : 'none');
    const filters = document.getElementById('filters');
    if (filters) filters.style.display = t.show_filters ? 'flex' : 'none';
    // 7. Accent color
    document.documentElement.style.setProperty('--lime', t.accent_color);
  }
  window.__applyCatalogTweaks = applyTweaks;

  renderTopbar('catalog');

  const state = { theme: 'all' };
  let products = [];
  let productPacks = {};

  function localizedProduct(p) {
    const lang = window.getLang();
    if (lang === 'en' || !productPacks[p.slug]) return p;
    const row = productPacks[p.slug][lang];
    return row ? window.localizeProduct(p, row) : p;
  }

  function themeLabel(key) {
    if (key === 'all') return window.t('theme_all');
    return window.t('theme_' + key) || key;
  }

  async function load() {
    const [prods, packs] = await Promise.all([
      fetch('assets/legacy/products.json').then((r) => r.json()),
      fetch('assets/legacy/products.i18n.json?v=1').then((r) => r.json()).catch(() => ({})),
    ]);
    products = prods;
    productPacks = packs || {};
    renderFilters();
    renderGrid();
  }

  function renderFilters() {
    const counts = { all: products.length };
    products.forEach(p => { counts[p.theme] = (counts[p.theme] || 0) + 1; });
    const themeKeys = ['all', 'streetwear', 'nostalgia', 'racing', 'kawaii', 'minimal', 'pets', 'starter', 'gaming', 'anime'];
    const themes = themeKeys.filter(k => k === 'all' || counts[k]);
    const el = document.getElementById('filters');
    el.innerHTML = themes.map(k => `
      <button class="filter-btn ${state.theme === k ? 'active' : ''}" data-theme="${k}">
        ${themeLabel(k)}<span class="count">${counts[k] || 0}</span>
      </button>
    `).join('');
    el.querySelectorAll('.filter-btn').forEach(b => b.onclick = () => {
      state.theme = b.dataset.theme;
      renderFilters();
      renderGrid();
    });
  }

  function shortenName(name) {
    // Strip leading brand prefix for card display; swap any other "Makoauto" mentions for the current brand.
    let n = name.replace(/^Makoauto\s+/i, '').replace(/^The\s+/i, '');
    // Trim long " | " or " - " tails
    if (n.length > 60) n = n.split(/\s+[\|\-–]\s+/)[0];
    if (n.length > 60) n = n.slice(0, 58).replace(/\s+\S*$/, '') + '…';
    const b = window.__catalogTweaks?.brand_name;
    if (b && b !== 'Makoauto') n = n.replace(/Makoauto/g, b);
    return n;
  }

  function firstSentence(desc) {
    const lines = desc.split('\n').map(l => l.trim()).filter(Boolean);
    let s = lines[0] || '';
    // Drop trailing emoji
    s = s.replace(/[\p{Extended_Pictographic}\u2600-\u27BF\uFE0F\s]+$/u, '');
    const b = window.__catalogTweaks?.brand_name;
    if (b && b !== 'Makoauto') s = s.replace(/Makoauto/g, b);
    return s;
  }

  function renderGrid() {
    const list = state.theme === 'all' ? products : products.filter(p => p.theme === state.theme);
    const el = document.getElementById('lookbook');
    el.innerHTML = list.map((p) => {
      const lp = localizedProduct(p);
      return `
      <article class="set-card">
        <a class="img-wrap" href="set.html?slug=${p.slug}">
          ${p.image ? `<img src="${p.image}" alt="${(lp.imageAlt || lp.name).replace(/"/g, '&quot;')}" loading="lazy">` : window.MakoautoPlaceholders.render(p.slug, p.price, window.t('lookbook_set_label'))}
          <span class="theme-tag">${themeLabel(p.theme) || p.theme}</span>
          <span class="price-tag">$${p.price.toFixed(2)}</span>
          ${p.in_stock === false ? `<span class="oos">${window.t('catalog_sold_out')}</span>` : ''}
        </a>
        <div class="body">
          <h3>${shortenName(lp.name)}</h3>
          <p class="blurb">${firstSentence(lp.description)}</p>
          <div class="ctas" style="${window.__catalogTweaks.show_remix_btn ? '' : 'grid-template-columns:1fr'}">
            <a class="primary" href="set.html?slug=${p.slug}">${window.t('catalog_view_set')}</a>
            ${window.__catalogTweaks.show_remix_btn ? `<a class="ghost" href="designer.html?from=${p.slug}">${window.t('catalog_remix')}</a>` : ''}
          </div>
        </div>
      </article>
    `;
    }).join('');
  }

  window.addEventListener('pinned:langchange', () => { renderFilters(); renderGrid(); window.applyI18N && window.applyI18N(); });
  window.addEventListener('pinned:tweakschange', () => { renderFilters(); renderGrid(); applyTweaks(); });
  load().then(() => applyTweaks());
</script>
</body></html>
