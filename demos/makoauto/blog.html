<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><title>Makoauto — Stories</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<meta name="description" content="Stories from Makoauto — pin culture, customer rides, behind the scenes from the LA studio.">
<link rel="canonical" href="https://qrost.github.io/demos/makoauto/blog.html">
<script>(function(){try{var t=localStorage.getItem('pinned_theme');if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<meta name="theme-color" content="#F5F0E3">
<meta property="og:site_name" content="Makoauto">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="Makoauto — Stories">
<meta property="og:description" content="Stories from Makoauto — pin culture, customer rides, behind the scenes from the LA studio.">
<meta property="og:image" content="assets/og-blog.png">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="shared/styles.css">
<style>
  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; }

  /* INDEX VIEW */
  .index-head { margin-bottom: 36px; }
  .index-head h1 { font-size: clamp(40px,6vw,72px); line-height: .98; margin-top: 8px; }
  .index-head p { color: var(--muted); margin-top: 12px; max-width: 540px; }
  .post-list { display: grid; gap: 28px; }
  .post-card { display: grid; grid-template-columns: 240px 1fr; gap: 28px; padding: 24px; background: var(--paper); border: var(--border-thick); border-radius: var(--radius-lg); box-shadow: var(--shadow-hard); transition: transform .12s, box-shadow .12s; cursor: pointer; }
  .post-card:hover { transform: translate(-3px,-3px); box-shadow: 7px 7px 0 0 var(--ink); }
  .post-card .img-wrap { aspect-ratio: 4/3; border-radius: var(--radius-md); overflow: hidden; border: 2px solid var(--ink); background: var(--bg-2); }
  .post-card .img-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .post-card .meta { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .post-card .meta .date { font-family: 'JetBrains Mono', monospace; font-size: 11px; text-transform: uppercase; color: var(--muted); }
  .post-card .meta h2 { font-size: 24px; line-height: 1.15; }
  .post-card .meta .blurb { font-size: 14px; color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .post-card .meta .read { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; align-self: flex-start; padding-top: 4px; text-decoration: none; color: var(--ink); }

  /* SINGLE POST VIEW */
  .post-back { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); text-decoration: none; display: inline-flex; align-items: center; gap: 4px; margin-bottom: 24px; }
  .post-back:hover { color: var(--ink); }
  .post-hero { aspect-ratio: 16/9; border-radius: var(--radius-lg); overflow: hidden; border: var(--border-thick); box-shadow: var(--shadow-hard-lg); margin-bottom: 32px; background: var(--bg-2); }
  .post-hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .post-meta { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
  .post-title { font-size: clamp(32px, 5vw, 56px); line-height: 1.02; margin-bottom: 16px; }
  .post-desc { font-size: 18px; color: var(--muted); line-height: 1.5; margin-bottom: 32px; max-width: 720px; }
  .post-body { font-size: 17px; line-height: 1.7; max-width: 720px; }
  .post-body p { margin: 0 0 18px; }
  .post-body h3 { font-size: 22px; margin: 32px 0 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; }
  .post-body strong { font-weight: 600; }

  .post-cta { margin-top: 60px; padding: 28px; background: var(--ink); color: var(--paper); border-radius: var(--radius-lg); display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; }
  .post-cta h3 { font-size: clamp(20px,2.6vw,28px); color: var(--paper); }
  .post-cta p { color: rgba(255,251,240,0.65); font-size: 14px; margin-top: 4px; }

  .next-section { margin-top: 60px; padding-top: 32px; border-top: 2px solid var(--ink); }
  .next-section h2 { font-size: 22px; margin-bottom: 16px; }
  .next-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .next-grid a { text-decoration: none; color: var(--ink); }
  .next-grid .mini { background: var(--paper); border: var(--border-thick); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-hard); transition: transform .12s; }
  .next-grid .mini:hover { transform: translate(-2px,-2px); }
  .next-grid .mini img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
  .next-grid .mini .name { padding: 10px 12px; font-size: 13px; font-weight: 600; line-height: 1.2; }

  @media (max-width: 720px) {
    .wrap { padding-left: max(20px, env(safe-area-inset-left, 0)); padding-right: max(20px, env(safe-area-inset-right, 0)); padding-bottom: calc(80px + env(safe-area-inset-bottom, 0px)); }
    .post-card { grid-template-columns: 1fr; gap: 16px; }
    .post-card .img-wrap { aspect-ratio: 16/10; }
    .post-cta { grid-template-columns: 1fr; text-align: center; }
    .post-cta .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<div data-topbar class="topbar"></div>
<div class="wrap" id="root">
  <p style="text-align:center;padding:60px;color:var(--muted)">Loading…</p>
</div>

<script src="shared/i18n.js?v=f4621bbf15"></script>
<script src="shared/i18n-extended.js?v=f756692940"></script>
<script>
  const params = new URLSearchParams(location.search);
  const slug = params.get('slug');
  const root = document.getElementById('root');
  let cacheBlogs = null;
  let cachePacks = null;

  const DATE_LOCALE = { en: 'en-US', zh: 'zh-CN', ja: 'ja-JP', es: 'es-ES', de: 'de-DE' };

  function fmtDate(iso) {
    if (!iso) return '';
    try {
      const d = new Date(iso);
      const lang = window.getLang();
      return d.toLocaleDateString(DATE_LOCALE[lang] || 'en-US', { year: 'numeric', month: 'short', day: 'numeric' });
    } catch (e) { return ''; }
  }

  function escapeHtml(s) { return s.replace(/[<>&]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c])); }

  function localizePost(post, packs) {
    const lang = window.getLang();
    const row = packs && packs[post.slug];
    if (!row || !row[lang]) return post;
    const loc = row[lang];
    return {
      ...post,
      title: loc.title || post.title,
      description: loc.description !== undefined && String(loc.description).length ? loc.description : post.description,
      body: loc.body || post.body,
      imageAlt: loc.imageAlt || post.imageAlt,
    };
  }

  function renderBody(body) {
    // Split into paragraphs by blank line. Bold-only-line → h3.
    const blocks = body.split(/\n\s*\n/);
    return blocks.map(b => {
      const t = b.trim();
      if (!t) return '';
      // Heading-ish: short single line, no terminal punctuation
      if (!t.includes('\n') && t.length < 80 && !/[.!?]$/.test(t) && t.split(' ').length <= 10) {
        return '<h3>' + escapeHtml(t) + '</h3>';
      }
      return '<p>' + escapeHtml(t).replace(/\n/g, '<br>') + '</p>';
    }).join('');
  }

  function renderIndex(blogs) {
    const packs = cachePacks || {};
    document.title = 'Makoauto — ' + window.t('nav_stories');
    const sorted = [...blogs].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
    const chip = window.t('stories_index_chip').replace(/\{n\}/g, String(blogs.length));
    root.innerHTML = `
      <div class="index-head">
        <span class="chip">${escapeHtml(chip)}</span>
        <h1>${escapeHtml(window.t('nav_stories'))}</h1>
        <p>${escapeHtml(window.t('stories_index_intro'))}</p>
      </div>
      <div class="post-list">
        ${sorted.map(b => {
          const bp = localizePost(b, packs);
          const blurb = bp.description || bp.body.slice(0, 220);
          return `
          <article class="post-card" onclick="location.href='blog.html?slug=${b.slug}'">
            <div class="img-wrap"><img src="${b.image}" alt="${escapeHtml(bp.title)}" loading="lazy"></div>
            <div class="meta">
              <span class="date">${fmtDate(b.date)}</span>
              <h2>${escapeHtml(bp.title)}</h2>
              <p class="blurb">${escapeHtml(blurb)}</p>
              <a class="read" href="blog.html?slug=${b.slug}">${escapeHtml(window.t('stories_read_more'))}</a>
            </div>
          </article>`;
        }).join('')}
      </div>
    `;
  }

  function renderSingle(blogs) {
    const packs = cachePacks || {};
    const post = blogs.find(b => b.slug === slug);
    if (!post) {
      root.innerHTML = `<p style="text-align:center;padding:60px"><strong>${escapeHtml(window.t('stories_not_found'))}</strong> <a href="blog.html">${escapeHtml(window.t('stories_back_list'))}</a></p>`;
      return;
    }
    const bp = localizePost(post, packs);
    document.title = bp.title + ' — Makoauto';
    const others = blogs.filter(b => b.slug !== slug).slice(0, 3);

    root.innerHTML = `
      <a class="post-back" href="blog.html">${escapeHtml(window.t('stories_back_all'))}</a>
      <div class="post-hero"><img src="${post.image}" alt="${escapeHtml(bp.title)}"></div>
      <div class="post-meta">${fmtDate(post.date)} · ${escapeHtml(window.t('stories_by'))} ${escapeHtml(post.author || 'Makoauto')}</div>
      <h1 class="post-title">${escapeHtml(bp.title)}</h1>
      ${bp.description ? `<p class="post-desc">${escapeHtml(bp.description)}</p>` : ''}
      <div class="post-body">${renderBody(bp.body)}</div>

      <div class="post-cta">
        <div>
          <h3>${escapeHtml(window.t('stories_cta_h'))}</h3>
          <p>${escapeHtml(window.t('stories_cta_p'))}</p>
        </div>
        <a class="btn primary" href="designer.html">${escapeHtml(window.t('stories_cta_design'))}</a>
        <a class="btn ghost" style="background:var(--paper);color:var(--ink)" href="catalog.html">${escapeHtml(window.t('stories_cta_shop'))}</a>
      </div>

      ${others.length ? `
        <div class="next-section">
          <h2>${escapeHtml(window.t('stories_read_next'))}</h2>
          <div class="next-grid">
            ${others.map(b => {
              const ob = localizePost(b, packs);
              return `
              <a href="blog.html?slug=${b.slug}">
                <div class="mini">
                  <img src="${b.image}" alt="${escapeHtml(ob.title)}" loading="lazy">
                  <div class="name">${escapeHtml(ob.title)}</div>
                </div>
              </a>`;
            }).join('')}
          </div>
        </div>
      ` : ''}
    `;
  }

  async function load() {
    const [blogs, packs] = await Promise.all([
      fetch('assets/legacy/blogs.json').then(r => r.json()),
      fetch('assets/legacy/blogs.i18n.json').then(r => r.json()).catch(() => ({})),
    ]);
    cacheBlogs = blogs;
    cachePacks = packs;
    if (slug) renderSingle(blogs);
    else renderIndex(blogs);
  }

  function showLoadError() {
    root.innerHTML = '<p class="mono" style="padding:60px 0;text-align:center;color:var(--muted)">Couldn\'t load stories right now — please refresh to try again.</p>';
  }

  renderTopbar('stories');
  window.addEventListener('pinned:langchange', () => {
    if (!cacheBlogs) return;
    if (slug) renderSingle(cacheBlogs);
    else renderIndex(cacheBlogs);
    window.applyI18N && window.applyI18N();
  });
  load().catch((e) => { console.warn('[blog] load failed:', e); showLoadError(); });
</script>
</body></html>
