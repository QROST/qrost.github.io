        <text x="18" y="31" font-size="12" font-weight="800" letter-spacing="1.5" fill="#68756f">STAY &amp; TRAVEL</text>
        <text x="18" y="61" font-size="18" font-weight="700" fill="#17201e">price + commute</text>
      </g>
    </g>

    <g transform="translate(0 448)">
      <rect x="0" y="0" width="322" height="48" rx="24" fill="#174f43"/>
