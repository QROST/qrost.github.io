    <line x1="0" y1="252" x2="562" y2="252" stroke="#bcc6bf" stroke-width="2"/>

    <g transform="translate(0 292)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
      <g>
        <rect x="0" y="0" width="162" height="92" rx="16" fill="#fffdf7" stroke="#d0d5ce"/>
        <text x="18" y="31" font-size="12" font-weight="800" letter-spacing="1.5" fill="#68756f">WHEN &amp; WHERE</text>
        <text x="18" y="61" font-size="18" font-weight="700" fill="#17201e">11-day itinerary</text>
