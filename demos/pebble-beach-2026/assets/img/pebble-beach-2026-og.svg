<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">2026 Pebble Beach and Monterey Car Week historical archive</title>
  <desc id="desc">Historical archive cover for the complete eleven-day Aug 7–17, 2026 public guide, with a stylized Monterey Peninsula route.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f3e9"/>
      <stop offset="1" stop-color="#d8e7df"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#c7ded7"/>
      <stop offset="1" stop-color="#89b8ac"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173f36" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1090" cy="-55" r="310" fill="#e8d4bf" opacity="0.58"/>
  <circle cx="1050" cy="640" r="280" fill="#c1d9d1" opacity="0.44"/>

  <g transform="translate(742 52)" filter="url(#shadow)">
