    <path d="M58 0c18 74 6 111 41 155 31 38 99 38 118 85 17 42-26 70 7 112 26 34 88 31 121 66 24 25 31 68 51 108H0V0Z" fill="url(#sea)"/>
    <path d="M58 0c18 74 6 111 41 155 31 38 99 38 118 85 17 42-26 70 7 112 26 34 88 31 121 66 24 25 31 68 51 108" fill="none" stroke="#174f43" stroke-width="4"/>
    <path d="M105 145c58 43 79 90 112 128 33 37 88 38 123 81 21 25 29 54 40 96" fill="none" stroke="#c5522d" stroke-width="4" stroke-dasharray="10 10"/>
    <path d="M217 273c-28 28-50 57-62 92" fill="none" stroke="#174f43" stroke-width="3" stroke-dasharray="7 9" opacity=".7"/>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-weight="700" fill="#17201e">
      <g transform="translate(95 142)"><circle r="9" fill="#fffdf7" stroke="#174f43" stroke-width="4"/><text x="18" y="5" font-size="15">Pacific Grove</text></g>
      <g transform="translate(156 365)"><circle r="11" fill="#fffdf7" stroke="#c5522d" stroke-width="5"/><text x="-18" y="-17" text-anchor="end" font-size="16">Pebble Beach</text></g>
      <g transform="translate(218 272)"><circle r="9" fill="#fffdf7" stroke="#174f43" stroke-width="4"/><text x="18" y="5" font-size="15">Monterey</text></g>
      <g transform="translate(302 352)"><circle r="9" fill="#fffdf7" stroke="#174f43" stroke-width="4"/><text x="18" y="5" font-size="15">Seaside</text></g>
      <g transform="translate(360 451)"><circle r="11" fill="#fffdf7" stroke="#c5522d" stroke-width="5"/><text x="-18" y="-17" text-anchor="end" font-size="16">Laguna Seca</text></g>
    </g>
    <text x="32" y="485" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12" font-weight="800" letter-spacing="5" fill="#174f43" opacity=".58">PACIFIC</text>
