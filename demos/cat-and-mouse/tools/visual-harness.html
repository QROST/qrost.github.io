<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>cat-mouse rAF-shim test</title>
<link rel="stylesheet" href="../assets/css/cat-and-mouse.css">
<script>
  // rAF 垫片：隐藏 tab 里 rAF 永不触发 → 手动步进驱动，顺便获得确定性帧控制。
  window.__frameQueue = [];
  window.requestAnimationFrame = (cb) => { window.__frameQueue.push(cb); return window.__frameQueue.length; };
  window.cancelAnimationFrame = () => {};
  window.__now = 1000;
  window.__step = (frames, ms) => {
    for (let i = 0; i < frames; i += 1) {
      window.__now += (ms || 16.7);
      const q = window.__frameQueue.splice(0);
      q.forEach((cb) => { try { cb(window.__now); } catch (e) { window.__stepErr = String(e.stack || e); } });
    }
    return window.__frameQueue.length;
  };
  // 隐藏 tab 中 ResizeObserver 不投递（rAF 耦合）→ 捕获回调手动触发
  window.ResizeObserver = class { constructor(cb) { window.__roCb = cb; } observe() {} disconnect() {} };
  window.__zoomCat = (R) => {
    const d = window.__catMouseDemo, s = d.getSnapshot();
    const c = document.getElementById('world'), dpr = s.viewport.dpr;
    const r = (R || 170) * dpr;
    const z = document.createElement('canvas'); z.width = 640; z.height = 640;
    const zc = z.getContext('2d');
    zc.fillStyle = '#20241e'; zc.fillRect(0, 0, 640, 640);
    zc.drawImage(c, s.cat.x * dpr - r, s.cat.y * dpr - r, r * 2, r * 2, 0, 0, 640, 640);
    let img = document.getElementById('zoomview');
    if (!img) { img = document.createElement('img'); img.id = 'zoomview'; img.style.cssText = 'position:fixed;top:8px;left:8px;width:420px;height:420px;z-index:9999;border:2px solid #999;'; document.body.appendChild(img); }
    img.src = z.toDataURL();
    return { x: Math.round(s.cat.x), y: Math.round(s.cat.y), state: s.behavior, speed: Math.round(s.cat.speed) };
  };
  window.__captureFrame = () => {
    const demo = window.__catMouseDemo;
    let snapshot = demo.getSnapshot();
    const centerDx = snapshot.viewport.width * 0.5 - snapshot.cat.x;
    const centerDy = snapshot.viewport.height * 0.5 - snapshot.cat.y;
    const centerDistance = Math.hypot(centerDx, centerDy);
    const directionX = centerDistance > 0.001 ? centerDx / centerDistance : 1;
    const directionY = centerDistance > 0.001 ? centerDy / centerDistance : 0;
    const targetDistance = snapshot.pounceGeometry.triggerMax * snapshot.rigScale;
    const targetX = snapshot.cat.x + directionX * targetDistance;
    const targetY = snapshot.cat.y + directionY * targetDistance;
    for (let repeat = 0; repeat < 16; repeat += 1) demo.moveMouse(targetX, targetY);
    for (let frame = 0; frame < 720; frame += 1) {
      window.__step(1);
      snapshot = demo.getSnapshot();
      if (snapshot.capture.active && snapshot.idlePose.captured && snapshot.idleMode) break;
    }
    if (!(snapshot.capture.active && snapshot.idlePose.captured)) {
      throw new Error('capture/rest sequence did not settle');
    }
    window.__step(90);
    snapshot = demo.getSnapshot();
    window.__zoomCat(180);
    return {
      behavior: snapshot.behavior,
      idleMode: snapshot.idleMode,
      capture: snapshot.capture.active,
      mouse: snapshot.mouse.rendered,
    };
  };
  window.__transitionFrame = () => {
    const demo = window.__catMouseDemo;
    demo.previewIdlePose('sit', 1);
    window.__step(150);
    demo.previewIdlePose('sideLie', 1);
    window.__step(42);
    const snapshot = demo.getSnapshot();
    window.__zoomCat(180);
    return {
      from: snapshot.idlePose.weights.sit,
      to: snapshot.idlePose.weights.sideLie,
      pawFrom: snapshot.idlePose.pawWeights.sit,
      pawTo: snapshot.idlePose.pawWeights.sideLie,
      progress: snapshot.idlePose.transition.progress,
      sway: snapshot.idlePose.transitionSway,
    };
  };
  window.__sleepFrame = () => {
    const demo = window.__catMouseDemo;
    demo.previewIdlePose('curl', -1);
    let snapshot = demo.getSnapshot();
    for (let frame = 0; frame < 1200; frame += 1) {
      window.__step(1);
      snapshot = demo.getSnapshot();
      if (snapshot.idlePose.sleepDepth > 0.72
        && snapshot.idlePose.twitch.active
        && Math.abs(snapshot.idlePose.twitch.value) > 0.2) break;
    }
    if (snapshot.idlePose.sleepDepth <= 0.72) throw new Error('sleep depth did not settle');
    window.__zoomCat(180);
    return {
      mode: snapshot.idleMode,
      sleepDepth: snapshot.idlePose.sleepDepth,
      breath: snapshot.idlePose.breath,
      twitch: snapshot.idlePose.twitch,
      face: snapshot.face,
    };
  };
  window.__poseSheet = () => {
    const demo = window.__catMouseDemo;
    const source = document.getElementById('world');
    const poses = [['sit', 1], ['loaf', -1], ['sideLie', 1], ['roll', -1], ['curl', 1]];
    const cell = 300;
    const sheet = document.createElement('canvas');
    sheet.width = cell * poses.length;
    sheet.height = cell + 38;
    const sc = sheet.getContext('2d');
    sc.fillStyle = '#20241e';
    sc.fillRect(0, 0, sheet.width, sheet.height);
    sc.font = '600 16px system-ui, sans-serif';
    sc.textAlign = 'center';
    sc.textBaseline = 'middle';
    const snapshots = [];
    poses.forEach(([mode, side], index) => {
      demo.previewIdlePose(mode, side);
      window.__step(150);
      const snapshot = demo.getSnapshot();
      const dpr = snapshot.viewport.dpr;
      const radius = 150 * dpr;
      sc.drawImage(
        source,
        snapshot.cat.x * dpr - radius,
        snapshot.cat.y * dpr - radius,
        radius * 2,
        radius * 2,
        index * cell,
        0,
        cell,
        cell,
      );
      sc.fillStyle = '#e8dfcf';
      sc.fillText(mode, index * cell + cell * 0.5, cell + 19);
      snapshots.push(snapshot);
    });
    demo.clearIdlePose();
    window.__step(100);
    let img = document.getElementById('posesheet');
    if (!img) {
      img = document.createElement('img');
      img.id = 'posesheet';
      img.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;width:calc(100% - 16px);height:auto;z-index:9999;border:2px solid #999;background:#20241e;';
      document.body.appendChild(img);
    }
    img.src = sheet.toDataURL();
    return snapshots.map((snapshot) => ({
      mode: snapshot.idlePose.visualMode,
      blend: snapshot.idlePose.blend,
      envelope: snapshot.poseEnvelope,
    }));
  };
</script>
</head>
<body>
  <main class="page">
    <section class="stage-frame">
      <div class="stage" id="stage">
        <canvas id="world" tabindex="0" style="width:1200px;height:640px;display:block;background:#20241e;"></canvas>
        <p id="canvas-error" hidden></p>
      </div>
    </section>
    <div class="hud" hidden>
      <span id="behavior-label"></span>
      <button id="pause-toggle"></button><button id="theme-toggle"></button>
    </div>
  </main>
  <script src="../assets/js/i18n.js"></script>
  <script src="../assets/js/gait.js"></script>
  <script src="../assets/js/app.js"></script>
</body>
</html>
