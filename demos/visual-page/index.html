<body>
  <div id="scene"></div>
  <div id="vignette"></div>
  <div id="grain"></div>

  <a id="home-link" href="../../index.html" aria-label="Back to QROST home · 返回 QROST 首页">QROST</a>

  <div id="hud">
    <div id="title" role="button" tabindex="0">DATA ABYSS <span id="lang-toggle">数渊</span></div>
    <div id="sub">chaos · breath · drift · weave · mind</div>
  </div>

  <div id="tip"><span id="tip-text"></span><button id="enable">Motion &amp; sound</button></div>

  <div id="card" class="hidden"></div>
  <div id="loading">Igniting the abyss…</div>

  <!-- Welcome gate: acknowledged click is also the user gesture that unlocks audio (mobile autoplay policy). -->
  <div id="welcome-gate" role="dialog" aria-modal="true" aria-labelledby="wg-title">
    <div class="wg-card">
      <h2 id="wg-title">Data Abyss · 数渊</h2>
      <p class="wg-en">A slowly breathing data cosmos. Best experienced with <strong>sound on</strong> — a generative lo-fi score is woven from the data you see.</p>
      <p class="wg-zh">一片缓缓呼吸的数据星海。建议<strong>开启声音</strong>——你会听到一首由眼前数据织成的生成式 lo-fi 配乐。</p>
      <button id="wg-enter" type="button">Enter · 进入</button>
    </div>
  </div>

  <!-- china-housing baked globals (classic scripts run before the module) -->
  <script src="../china-housing/assets/data/listings.js"></script>
  <script src="../china-housing/assets/data/enriched.js"></script>
  <script src="../china-housing/assets/data/hazards.js"></script>

  <!-- 提前并行拉取 three（模块顶部 import 的最大阻塞项）→ 缩短冷网下"门已可点但模块还没加载完、
       点确认那一下被丢弃"的竞态窗口。非完全消除；彻底解法是把音频解锁原语搬到 parse-time inline script（见后续）。 -->
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" crossorigin>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js?v=e373a95507"></script>
</body>
