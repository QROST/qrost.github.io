<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#04050a" />
  <title>数渊 · Data Abyss — 中国宜居 × 工业自立</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="scene"></div>
  <div id="vignette"></div>
  <div id="grain"></div>

  <div id="hud">
    <div id="title">数渊 <span>DATA ABYSS</span></div>
    <div id="sub">一城的冷暖，一国的自立，在此沉为混沌深处漂流的星。<br/>每一缕光都生于真实，却不必被读懂——它们只是明灭、漂移、呼吸。</div>
  </div>

  <div id="tip">拖动以环视 · 滚轮调焦 · 触碰一颗星，照见它的来处 <button id="enable">唤醒感应与声响</button></div>

  <div id="card" class="hidden"></div>
  <div id="loading">正在点亮数渊…</div>

  <!-- china-housing baked globals (classic scripts run before the module) -->
  <script src="../china-housing/assets/data/listings.js"></script>
  <script src="../china-housing/assets/data/enriched.js"></script>
  <script src="../china-housing/assets/data/hazards.js"></script>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="app.js"></script>
