      <stop offset="1" stop-color="#edf2ed"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173f36" flood-opacity="0.15"/>
