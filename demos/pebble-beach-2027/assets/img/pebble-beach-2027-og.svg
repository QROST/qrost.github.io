<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pebble Beach 2027 early guide</title>
  <desc id="desc">A bilingual early guide with seven official event ranges confirmed and travel details still developing.</desc>
  <defs>
